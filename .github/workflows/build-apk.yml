name: Build FASHIN Play APK

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Fix equalizer_flutter namespace
        run: |
          EQUALIZER_BUILD_GRADLE="$HOME/.pub-cache/hosted/pub.dev/equalizer_flutter-0.0.1/android/build.gradle"
          if [ -f "$EQUALIZER_BUILD_GRADLE" ]; then
            sed -i 's/android {/android {\n    namespace "com.equalizer.flutter"/' "$EQUALIZER_BUILD_GRADLE"
            echo "✅ Added namespace to equalizer_flutter build.gradle"
          else
            echo "⚠️  equalizer_flutter build.gradle not found at expected location"
          fi
      
      - name: Build APK Release
        run: flutter build apk --release
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FASHIN-Play-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
